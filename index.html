<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Loopz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            color: #fff;
        }

        .feed-container {
            width: 100%;
            height: calc(100vh - 60px);
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }

        .feed-container::-webkit-scrollbar {
            display: none;
        }

        .video-card {
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            position: relative;
            background: #000;
        }

        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .top-header {
            position: absolute;
            top: 15px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 20;
            font-size: 16px;
            font-weight: 700;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .top-header span {
            opacity: 0.5;
        }

        .top-header span.active {
            opacity: 1;
            border-bottom: 2px solid #fff;
            padding-bottom: 2px;
        }

        .ui-overlay {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 80px;
            z-index: 10;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .username {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 6px;
        }

        .caption {
            font-size: 14px;
            line-height: 1.3;
            opacity: 0.95;
            margin-bottom: 8px;
        }

        .sound-tag {
            font-size: 13px;
            opacity: 0.85;
        }

        .side-actions {
            position: absolute;
            right: 12px;
            bottom: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: white;
            width: 42px;
            height: 42px;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .action-count {
            font-size: 12px;
            font-weight: 600;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            border-top: 0.5px solid rgba(255,255,255,0.15);
        }

        .nav-item {
            background: none;
            border: none;
            color: #777;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-item.active {
            color: #fff;
            font-weight: bold;
        }

        .upload-nav-btn {
            background: #fff;
            border: none;
            width: 44px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-weight: bold;
            font-size: 20px;
        }

        .floating-heart {
            position: absolute;
            font-size: 80px;
            transform: translate(-50%, -50%) scale(0);
            animation: popHeart 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 50;
        }

        @keyframes popHeart {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2) rotate(10deg); opacity: 1; }
            100% { transform: translate(-50%, -80%) scale(1) rotate(0deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="top-header">
        <span>Following</span>
        <span class="active">Loopz Feed</span>
    </div>

    <div class="feed-container">
        <div class="video-card" onclick="handleDoubleTap(event)">
            <video src="https://www.w3schools.com/html/mov_bbb.mp4" loop playsinline muted></video>
            
            <div class="ui-overlay">
                <div class="username">@creator</div>
                <div class="caption">Welcome to Loopz 🔁 Fresh build running smooth.</div>
                <div class="sound-tag">🎵 Original Audio</div>
            </div>

            <div class="side-actions" onclick="event.stopPropagation()">
                <div class="action-item">
                    <button class="action-btn" onclick="toggleLike(this)">❤️</button>
                    <span class="action-count">1.2K</span>
                </div>
                <div class="action-item">
                    <button class="action-btn">💬</button>
                    <span class="action-count">88</span>
                </div>
                <div class="action-item">
                    <button class="action-btn">↗️</button>
                    <span class="action-count">14</span>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active">Home</button>
        <button class="nav-item">Explore</button>
        <button class="upload-nav-btn">+</button>
        <button class="nav-item">Inbox</button>
        <button class="nav-item">Profile</button>
    </nav>

    <script>
        let lastTap = 0;
        function handleDoubleTap(e) {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            
            if (tapLength < 300 && tapLength > 0) {
                const card = e.currentTarget;
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.innerHTML = '❤️';
                
                const rect = card.getBoundingClientRect();
                heart.style.left = (e.clientX - rect.left) + 'px';
                heart.style.top = (e.clientY - rect.top) + 'px';
                
                card.appendChild(heart);
                setTimeout(() => heart.remove(), 800);

                const likeBtn = card.querySelector('.action-btn');
                likeBtn.style.color = '#ff3b30';
            }
            lastTap = currentTime;
        }

        function toggleLike(btn) {
            btn.style.color = btn.style.color === 'rgb(255, 59, 48)' ? 'white' : '#ff3b30';
        }

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                if (entry.isIntersecting) {
                    video.play().catch(() => {});
                } else {
                    video.pause();
                }
            });
        }, { threshold: 0.6 });

        document.querySelectorAll('.video-card').forEach(card => {
            observer.observe(card);
        });
    </script>
</body>
</html>
