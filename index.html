<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loopz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <div class="top-header">
        <div class="logo">LOOPZ</div>
        <button id="open-auth-btn" class="btn-primary" style="padding: 6px 14px; font-size: 12px;">Sign In</button>
    </div>

    <!-- Feed -->
    <div class="feed-container" id="feed">
        <div class="video-card">
            <video src="https://www.w3schools.com/html/mov_bbb.mp4" loop playsinline muted></video>
            
            <div class="action-sidebar">
                <button class="action-btn">⚡ <span>1.4K</span></button>
                <button class="action-btn">💬 <span>92</span></button>
                <button class="action-btn">🔁 <span>Shared</span></button>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="bottom-nav">
        <button class="nav-item">Home</button>
        <button class="loopz-upload-btn">+</button>
        <button class="nav-item" id="profile-username">Profile</button>
    </nav>

    <!-- Authentication Modal (Sign Up / Sign In) -->
    <div class="modal-overlay" id="auth-modal">
        <div class="auth-card">
            <h2 style="text-align: center;">Join Loopz</h2>
            <p style="font-size: 12px; color: #aaa; text-align: center;">Sign up to share loops & interact.</p>
            
            <button class="btn-google" id="google-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
                Continue with Google
            </button>

            <div style="text-align: center; font-size: 12px; color: #555;">OR</div>

            <input type="text" id="signup-username" placeholder="Username">
            <input type="email" id="signup-email" placeholder="Email address">
            <input type="password" id="signup-password" placeholder="Password">

            <button class="btn-primary" id="email-signup-btn">Create Account</button>
        </div>
    </div>

    <!-- Load Firebase module script -->
    <script type="module">
        import { signUpWithEmail, signUpWithGoogle } from './firebase.js';

        document.getElementById('google-btn').addEventListener('click', signUpWithGoogle);
        
        document.getElementById('email-signup-btn').addEventListener('click', () => {
            const username = document.getElementById('signup-username').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            signUpWithEmail(email, password, username);
        });

        document.getElementById('open-auth-btn').addEventListener('click', () => {
            document.getElementById('auth-modal').style.display = 'flex';
        });
    </script>
</body>
</html>
