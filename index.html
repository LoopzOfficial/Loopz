<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loopz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Feed Header -->
    <div class="top-header">
        <button class="feed-tab active" id="tab-foryou">For You</button>
        <span style="color: #444;">|</span>
        <button class="feed-tab" id="tab-following">Following</button>
    </div>

    <!-- Main Mobile Feed -->
    <div id="feed">
        <div class="video-card">
            <p style="color: #666; font-size: 14px;">Loading Loopz feed... ⚡</p>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <button class="nav-btn" id="home-btn">🏠 Home</button>
        <button class="loopz-upload-btn">+</button>
        <button class="nav-btn" id="profile-btn">👤 Profile</button>
    </div>

    <!-- Instagram-Style Profile Screen Overlay -->
    <div class="modal-overlay" id="profile-modal" style="display: none;">
        <div class="profile-screen">
            <!-- Top Nav -->
            <div class="profile-nav-bar">
                <button class="icon-btn" id="close-profile-btn">✕</button>
                <div class="profile-header-title" id="profile-header-username">@username</div>
                <button class="icon-btn">⚙️</button>
            </div>

            <!-- Profile Info Header -->
            <div class="profile-header-content">
                <div class="profile-top-row">
                    <!-- Avatar Ring -->
                    <div class="profile-avatar-wrapper">
                        <img id="profile-pfp" src="https://via.placeholder.com/80" class="profile-pfp">
                    </div>

                    <!-- Posts / Followers / Following Stats -->
                    <div class="profile-stats-row">
                        <div class="stat-box">
                            <span class="stat-num" id="stat-posts-count">0</span>
                            <span class="stat-label">Posts</span>
                        </div>
                        <div class="stat-box">
                            <span class="stat-num" id="stat-followers-count">0</span>
                            <span class="stat-label">Followers</span>
                        </div>
                        <div class="stat-box">
                            <span class="stat-num" id="stat-following-count">0</span>
                            <span class="stat-label">Following</span>
                        </div>
                    </div>
                </div>

                <!-- Display Name & Bio -->
                <div class="profile-info-section">
                    <div class="profile-display-name" id="profile-display-name">Username</div>
                    <div class="profile-bio-text" id="profile-bio">Welcome to my Loopz profile! ⚡</div>
                </div>

                <!-- Action Buttons -->
                <div class="profile-actions-row">
                    <button class="btn-secondary" id="open-edit-profile-btn">Edit Profile</button>
                    <button class="btn-secondary" id="share-profile-btn">Share Profile</button>
                </div>
            </div>

            <!-- Grid Tabs -->
            <div class="profile-tabs">
                <button class="profile-tab active">▦</button>
            </div>

            <!-- 3-Column Video Grid -->
            <div class="profile-grid" id="user-posts-grid">
                <!-- User loops render here -->
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal-overlay" id="edit-profile-modal" style="display: none;">
        <div class="auth-card">
            <h2 style="text-align: center; font-size: 18px;">Edit Profile</h2>

            <label class="input-label">Profile Photo</label>
            <input type="file" id="edit-pfp-file" accept="image/*">

            <label class="input-label">Username / Handle</label>
            <input type="text" id="edit-username-input" placeholder="Username">

            <label class="input-label">Bio</label>
            <textarea id="edit-bio-input" rows="3" placeholder="Write a bio..." class="custom-textarea"></textarea>

            <div id="edit-profile-status" style="font-size: 12px; text-align: center; color: #a855f7;"></div>

            <button class="btn-primary" id="save-profile-btn">Save Changes 💾</button>
            <button class="btn-primary" id="close-edit-modal-btn" style="background: #333;">Cancel</button>
        </div>
    </div>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="auth-modal" style="display: flex;">
        <div class="auth-card">
            <h2 style="text-align: center;">Join Loopz</h2>
            <p style="font-size: 12px; color: #aaa; text-align: center;">Sign up to share loops & interact.</p>

            <button id="google-signin-btn" class="btn-primary" style="background:#fff; color:#000; display:flex; align-items:center; justify-content:center; gap:8px;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
                Continue with Google
            </button>

            <p style="text-align:center; font-size:12px; color:#888;">OR</p>

            <input type="text" id="auth-username" placeholder="Username">
            <input type="email" id="auth-email" placeholder="Email">
            <input type="password" id="auth-password" placeholder="Password">

            <button id="create-account-btn" class="btn-primary">Create Account</button>
            <button id="close-auth-btn" style="background:none; border:none; color:#888; font-size:12px; cursor:pointer;">Close</button>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="upload-modal" style="display: none;">
        <div class="auth-card">
            <h2 style="text-align: center;">New Loop</h2>
            <p style="font-size: 12px; color: #aaa; text-align: center;">Choose a video from your camera roll.</p>

            <input type="file" id="video-file-input" accept="video/*">
            <input type="text" id="video-caption-input" placeholder="Write a caption...">

            <div id="upload-status" style="font-size: 12px; text-align: center; color: #a855f7;"></div>

            <button class="btn-primary" id="publish-loop-btn">Post Loop 🔁</button>
            <button class="btn-primary" id="close-upload-btn" style="background: #333;">Cancel</button>
        </div>
    </div>

    <!-- JS Module Handlers -->
    <script type="module">
        import { auth, signUpWithGoogle, signUpWithEmail, getUserProfileData } from './firebase.js';
        import { uploadVideoToLoopz, updateUserProfile, loadLoopzFeed, openProfileView } from './app.js';

        // Auth Event Handlers
        document.getElementById('google-signin-btn').addEventListener('click', signUpWithGoogle);

        document.getElementById('create-account-btn').addEventListener('click', () => {
            const username = document.getElementById('auth-username').value.trim();
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;

            if (!username || !email || !password) {
                alert("Please fill in all fields!");
                return;
            }
            signUpWithEmail(email, password, username);
        });

        document.getElementById('close-auth-btn').addEventListener('click', () => {
            document.getElementById('auth-modal').style.display = 'none';
        });

        // Feed Tabs
        const tabForYou = document.getElementById('tab-foryou');
        const tabFollowing = document.getElementById('tab-following');

        tabForYou.addEventListener('click', () => {
            tabForYou.classList.add('active');
            tabFollowing.classList.remove('active');
            loadLoopzFeed('foryou');
        });

        tabFollowing.addEventListener('click', () => {
            tabFollowing.classList.add('active');
            tabForYou.classList.remove('active');
            loadLoopzFeed('following');
        });

        // Upload Navigation
        document.querySelector('.loopz-upload-btn').addEventListener('click', () => {
            if (!auth.currentUser) {
                document.getElementById('auth-modal').style.display = 'flex';
            } else {
                document.getElementById('upload-modal').style.display = 'flex';
            }
        });

        document.getElementById('close-upload-btn').addEventListener('click', () => {
            document.getElementById('upload-modal').style.display = 'none';
        });

        document.getElementById('publish-loop-btn').addEventListener('click', () => {
            const fileInput = document.getElementById('video-file-input');
            const captionInput = document.getElementById('video-caption-input');
            
            if (fileInput.files.length > 0) {
                uploadVideoToLoopz(fileInput.files[0], captionInput.value);
            } else {
                alert("Please pick a video file first!");
            }
        });

        // Profile Navigation & Modal Triggers
        const profileBtn = document.getElementById('profile-btn');

        profileBtn.addEventListener('click', () => {
            if (!auth.currentUser) {
                document.getElementById('auth-modal').style.display = 'flex';
            } else {
                openProfileView(auth.currentUser.uid);
            }
        });

        document.getElementById('close-profile-btn').addEventListener('click', () => {
            document.getElementById('profile-modal').style.display = 'none';
        });

        // Edit Profile Triggers
        document.getElementById('open-edit-profile-btn').addEventListener('click', async () => {
            const user = auth.currentUser;
            if (!user) return;

            document.getElementById('edit-username-input').value = user.displayName || "";
            
            const profileData = await getUserProfileData(user.uid);
            document.getElementById('edit-bio-input').value = profileData?.bio || "";

            document.getElementById('edit-profile-modal').style.display = 'flex';
        });

        document.getElementById('close-edit-modal-btn').addEventListener('click', () => {
            document.getElementById('edit-profile-modal').style.display = 'none';
        });

        document.getElementById('save-profile-btn').addEventListener('click', () => {
            const newUsername = document.getElementById('edit-username-input').value.trim();
            const newBio = document.getElementById('edit-bio-input').value.trim();
            const pfpInput = document.getElementById('edit-pfp-file');
            const pfpFile = pfpInput.files.length > 0 ? pfpInput.files[0] : null;

            updateUserProfile(newUsername, newBio, pfpFile);
        });

        // Sync Auth State
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('auth-modal').style.display = 'none';
                profileBtn.innerText = `@${user.displayName || user.email.split('@')[0]}`;
            } else {
                profileBtn.innerText = "👤 Profile";
            }
        });
    </script>
</body>
</html>
