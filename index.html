<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loopz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Feed -->
    <div id="feed">
        <div class="video-card">
            <p style="color: #666; font-size: 14px;">No loops posted yet. Tap + to upload!</p>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <button class="nav-btn">🏠 Home</button>
        <button class="loopz-upload-btn">+</button>
        <button class="nav-btn" id="profile-btn">👤 Profile</button>
    </div>

    <!-- Authentication Modal -->
    <div class="modal-overlay" id="auth-modal" style="display: flex;">
        <div class="auth-card">
            <h2 style="text-align: center;">Join Loopz</h2>
            <p style="font-size: 12px; color: #aaa; text-align: center;">Sign up to share loops & interact.</p>

            <button id="google-signin-btn" class="btn-primary" style="background:#fff; color:#000; display:flex; align-items:center; justify-content:center; gap:8px;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
                Continue with Google
            </button>

            <p style="text-align:center; font-size:12px; color:#888;">OR</p>

            <input type="text" id="auth-username" placeholder="Username">
            <input type="email" id="auth-email" placeholder="Email">
            <input type="password" id="auth-password" placeholder="Password">

            <button id="create-account-btn" class="btn-primary">Create Account</button>
            <button id="close-auth-btn" style="background:none; border:none; color:#888; font-size:12px; cursor:pointer;">Close</button>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="upload-modal" style="display: none;">
        <div class="auth-card">
            <h2 style="text-align: center;">New Loop</h2>
            <p style="font-size: 12px; color: #aaa; text-align: center;">Choose a video from your camera roll.</p>

            <input type="file" id="video-file-input" accept="video/*">
            <input type="text" id="video-caption-input" placeholder="Write a caption...">

            <div id="upload-status" style="font-size: 12px; text-align: center; color: #a855f7;"></div>

            <button class="btn-primary" id="publish-loop-btn">Post Loop 🔁</button>
            <button class="btn-primary" id="close-upload-btn" style="background: #333;">Cancel</button>
        </div>
    </div>

    <!-- Application Script Module -->
    <script type="module">
        import { auth, signUpWithGoogle, signUpWithEmail } from './firebase.js';
        import { uploadVideoToLoopz } from './app.js';

        // Auth Listeners
        document.getElementById('google-signin-btn').addEventListener('click', signUpWithGoogle);

        document.getElementById('create-account-btn').addEventListener('click', () => {
            const username = document.getElementById('auth-username').value.trim();
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;

            if (!username || !email || !password) {
                alert("Please fill in all fields!");
                return;
            }

            signUpWithEmail(email, password, username);
        });

        document.getElementById('close-auth-btn').addEventListener('click', () => {
            document.getElementById('auth-modal').style.display = 'none';
        });

        // Navigation & Modal Triggers
        document.querySelector('.loopz-upload-btn').addEventListener('click', () => {
            if (!auth.currentUser) {
                document.getElementById('auth-modal').style.display = 'flex';
            } else {
                document.getElementById('upload-modal').style.display = 'flex';
            }
        });

        document.getElementById('close-upload-btn').addEventListener('click', () => {
            document.getElementById('upload-modal').style.display = 'none';
        });

        document.getElementById('publish-loop-btn').addEventListener('click', () => {
            const fileInput = document.getElementById('video-file-input');
            const captionInput = document.getElementById('video-caption-input');
            
            if (fileInput.files.length > 0) {
                uploadVideoToLoopz(fileInput.files[0], captionInput.value);
            } else {
                alert("Please pick a video file first!");
            }
        });

        // Profile Button / Auth Status Check
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('auth-modal').style.display = 'none';
                document.getElementById('profile-btn').innerText = `@${user.displayName || user.email.split('@')[0]}`;
            }
        });
    </script>
</body>
</html>
